name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOTNET_ROLL_FORWARD: "major"
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.400'

      - name: Install .NET Android Workload
        run: dotnet workload install android

      - name: Restore Dependencies
        run: dotnet restore Client/Camera.csproj

      - name: Build Android App
        run: dotnet build Client/Camera.csproj -c Release -p:BuildingInsideVisualStudio=true -p:IgnoreCase=true

      - name: Publish Android APK
        run: dotnet publish Client/Camera.csproj -c Release -f net8.0-android

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroSpy-Client-Build
          path: |
            Client/bin/Release/net8.0-android/publish/*.apk
            Client/bin/Release/net8.0-android/*.apk
            Client/bin/Release/net8.0-android/*.dll
            Client/bin/Debug/net8.0-android/*.dll